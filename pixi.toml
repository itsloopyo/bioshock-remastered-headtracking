[workspace]
name = "bioshock-head-tracking"
version = "0.3.2"
description = "Head tracking mod for BioShock Remastered using OpenTrack"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
# Game is 32-bit, so always target i686-pc-windows-msvc.
# Use rustup cargo/rustc explicitly to avoid chocolatey rust conflict.
sync = "git submodule update --remote cameraunlock-core"
build = "RUSTC=~/.cargo/bin/rustc ~/.cargo/bin/cargo build --target i686-pc-windows-msvc"
build-release = "RUSTC=~/.cargo/bin/rustc ~/.cargo/bin/cargo build --release --target i686-pc-windows-msvc"
clean = "cargo clean"
# Tests + clippy MUST also build for i686 - the engine hook uses
# `extern "thiscall"`, which is only supported on x86 targets and
# fails to compile on 64-bit hosts.
test = { depends-on = ["test-unit", "test-vectors"] }
test-unit = "cargo test --target i686-pc-windows-msvc"
# The shared pipeline conformance vectors, run against this port. The vectors,
# the constants and every assertion live in cameraunlock-core; src/conformance.rs
# is only the executor that drives our pipeline through them, and it answers
# `skip <reason>` for the units this port does not have rather than reporting a
# pass for a test that never ran. Where a local test and a vector disagree, the
# vector is right.
test-vectors = { cmd = "node cameraunlock-core/scripts/pipeline-vectors/run-vectors.mjs --vectors cameraunlock-core/data/pipeline-conformance.json --harness target/i686-pc-windows-msvc/debug/conformance_harness.exe", depends-on = ["build-harness"] }
build-harness = "cargo build --target i686-pc-windows-msvc --bin conformance_harness"
lint = "cargo clippy --target i686-pc-windows-msvc -- -D warnings"
fmt = "cargo fmt --check"
fmt-fix = "cargo fmt"
bench = "cargo bench"
bench-quick = "cargo bench -- --quick"
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 -Configuration Debug", depends-on = ["build"] }
install-release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 -Configuration Release", depends-on = ["build-release"] }
validate-release = "powershell -ExecutionPolicy Bypass -File scripts/validate-release.ps1"
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package.ps1", depends-on = ["build-release"] }
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"
update-deps = "powershell -NoProfile -Command \"Write-Host 'No vendored dependencies to update (shim-only mod).'\""
detect-game = "powershell -ExecutionPolicy Bypass -File scripts/detect-game.ps1"
uninstall = "cmd /c scripts\\uninstall.cmd"
# Shim uninstall already restores .backup originals and removes the state
# file, so "vanilla" is just a non-interactive uninstall.
vanilla = "cmd /c scripts\\uninstall.cmd /y"
clean-all = "cargo clean; powershell -Command \"Remove-Item -Recurse -Force *.log -ErrorAction SilentlyContinue\""
