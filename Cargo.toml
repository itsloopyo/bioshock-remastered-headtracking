[package]
name = "bioshock-remastered-head-tracking"
version = "0.4.0"
edition = "2021"
authors = ["itsloopyo / CameraUnlock"]
description = "Decoupled look+aim head tracking mod for BioShock Remastered via OpenTrack UDP. Part of the CameraUnlock project."
license = "MIT"
repository = "https://github.com/itsloopyo/bioshock-remastered-headtracking"
readme = "README.md"

[lib]
name = "bioshock_headtrack"
# rlib alongside the cdylib so `src/bin/conformance_harness.rs` - a separate
# crate by construction - can link the pipeline. The shipped artifact is still
# the cdylib; the rlib is a build-tree file.
crate-type = ["cdylib", "rlib"]

[dependencies]
parking_lot = "0.12.3"
log = "0.4.22"
simplelog = "0.12.2"
once_cell = "1.20.2"
minhook = "0.8.0"

[build-dependencies]
cc = "=1.2.51"

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Foundation_Numerics",
]

[profile.release]
opt-level = 3
lto = false
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
